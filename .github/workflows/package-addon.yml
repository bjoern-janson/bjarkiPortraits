name: Package addon

on:
  push:
    branches: [main, 'feat/secondary-portrait-p1', 'rescue/low-overhead-0.1.249']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Lua 5.1 and 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4
      - name: Verify current source and package
        run: |
          python3 tools/verify.py --output "$RUNNER_TEMP/bjarkiPortraits-verified.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/bjarkiPortraits-verified.zip" "$RUNNER_TEMP/bjarkiPortraits-package"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bjarkiPortraits
          path: ${{ runner.temp }}/bjarkiPortraits-package
          if-no-files-found: error
