name: Package addon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4
      - name: Check Lua syntax and behavioral regressions
        run: |
          set -euo pipefail
          for version in 5.1 5.4; do
            for file in Spells.lua Core.lua SecondaryPortrait.lua NativeSecondProbe.lua StanceState.lua SharedEvidence.lua EvidencePublisher.lua Priority.lua AuraEngine.lua PetPortraits.lua Commands.lua Main.lua tests/*.lua; do
              "luac${version}" -p "$file"
            done
            "lua${version}" tests/low-priority.lua
            "lua${version}" tests/secondary-portrait.lua
            "lua${version}" tests/native-second-probe.lua
            "lua${version}" tests/secondary-aura-election.lua
            "lua${version}" tests/secondary-real-tiers.lua
            "lua${version}" tests/secondary-hostile-target.lua
            "lua${version}" tests/secondary-npc-harmful.lua
            "lua${version}" tests/secondary-filter-proof.lua
            "lua${version}" tests/secondary-debug.lua
            "lua${version}" tests/secondary-load-order.lua
            "lua${version}" tests/secondary-ghost-state.lua
            "lua${version}" tests/secondary-ghost-real-host.lua
            "lua${version}" tests/secondary-form-ranking.lua
            "lua${version}" tests/pet-icon-crop.lua
            "lua${version}" tests/shiny-silver-coin.lua
            "lua${version}" tests/launch-auras.lua
            "lua${version}" tests/decimal-threshold.lua
            "lua${version}" tests/priority-overhaul.lua
            "lua${version}" tests/class-aura-coverage.lua
            "lua${version}" tests/hostile-helpful-priority.lua
            "lua${version}" tests/derived-evidence.lua
            "lua${version}" tests/pending-evidence-recovery.lua
            "lua${version}" tests/access-guards.lua
            "lua${version}" tests/priority-recovery.lua
            "lua${version}" tests/compact-slows.lua
            "lua${version}" tests/portrait-restoration.lua
            "lua${version}" tests/stance-state.lua
          done
      - name: Stage addon
        run: |
          mkdir -p dist/bjarkiPortraits
          cp Spells.lua Core.lua SecondaryPortrait.lua NativeSecondProbe.lua StanceState.lua SharedEvidence.lua EvidencePublisher.lua Priority.lua AuraEngine.lua PetPortraits.lua Commands.lua Main.lua bjarkiPortraits.toc bjarkiPortraits_Camelot.toc dist/bjarkiPortraits/
      - uses: actions/upload-artifact@v4
        with:
          name: bjarkiPortraits
          path: dist
          if-no-files-found: error
